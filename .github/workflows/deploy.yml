name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Resolve EC2 instance for SSM
        id: ec2
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/gh_ssm_resolve_instance.sh
          INSTANCE_ID="$(bash scripts/deploy/gh_ssm_resolve_instance.sh)"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "Using EC2 instance: ${INSTANCE_ID}"

      - name: Deploy to EC2 using Docker (SSM)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/ec2-user/apps/resulam_royalties' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'resulam-royalties' }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'resulam-royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
          DASH_PORT: ${{ secrets.DASH_PORT || '8050' }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'africanlanguagelibrary.tchamna.com' }}
          OLD_DOMAIN_NAME: ${{ secrets.OLD_DOMAIN_NAME || 'resulam-royalties.tchamna.com' }}
          CONFIGURE_NGINX: ${{ secrets.CONFIGURE_NGINX || 'true' }}
          ZERO_DOWNTIME: ${{ secrets.ZERO_DOWNTIME || 'true' }}
          KEEP_NEXT_CONTAINER_ON_FAILURE: ${{ secrets.KEEP_NEXT_CONTAINER_ON_FAILURE || 'true' }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/gh_ssm_deploy.sh
          bash scripts/deploy/gh_ssm_deploy.sh "${{ steps.ec2.outputs.instance_id }}"

      - name: Check application logs
        if: always()
        env:
          APP_DIR: ${{ secrets.APP_DIR || '/home/ec2-user/apps/resulam_royalties' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'resulam-royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/gh_ssm_check_logs.sh
          bash scripts/deploy/gh_ssm_check_logs.sh "${{ steps.ec2.outputs.instance_id }}"

      - name: Verify deployment
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'africanlanguagelibrary.tchamna.com' }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/ec2-user/apps/resulam_royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/gh_ssm_verify_local.sh
          echo "Verifying application health..."
          max_attempts=12
          for i in $(seq 1 $max_attempts); do
            if curl -sf "https://$DOMAIN_NAME/" > /dev/null 2>&1; then
              echo "OK: https://$DOMAIN_NAME"
              exit 0
            fi
            if bash scripts/deploy/gh_ssm_verify_local.sh "${{ steps.ec2.outputs.instance_id }}"; then
              echo "OK: container is responding on localhost (upstream port from state file)"
              exit 0
            fi
            echo "Attempt $i/$max_attempts: waiting..."
            sleep 5
          done
          echo "ERROR: Health check failed"
          exit 1

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Resolve EC2 instance for SSM
        id: ec2
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/gh_ssm_resolve_instance.sh
          INSTANCE_ID="$(bash scripts/deploy/gh_ssm_resolve_instance.sh)"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"

      - name: Rollback (docker via SSM)
        env:
          APP_DIR: ${{ secrets.APP_DIR || '/home/ec2-user/apps/resulam_royalties' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'resulam-royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
          DASH_PORT: ${{ secrets.DASH_PORT || '8050' }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'africanlanguagelibrary.tchamna.com' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'resulam-royalties' }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          AUTO_SYNC_INTERVAL: ${{ secrets.AUTO_SYNC_INTERVAL || '60' }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy/gh_ssm_rollback.sh
          bash scripts/deploy/gh_ssm_rollback.sh "${{ steps.ec2.outputs.instance_id }}"
