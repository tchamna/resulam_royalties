name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options: [production, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2 using Docker
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          APP_DIR: ${{ secrets.APP_DIR || '/home/ec2-user/apps/resulam-royalties' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'resulam-royalties' }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'resulam-royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
          DASH_PORT: ${{ secrets.DASH_PORT || '8050' }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'resulam-royalties.tchamna.com' }}
          OLD_DOMAIN_NAME: ${{ secrets.OLD_DOMAIN_NAME || '' }}
          CONFIGURE_NGINX: ${{ secrets.CONFIGURE_NGINX || 'false' }}
        run: |
          set -euo pipefail
          echo "Deploying to EC2..."

          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "set -euo pipefail; \
            cd '$APP_DIR'; \
            rm -f royalties_exploded_2024.csv royalties_per_author_2024.csv royalties_resulambooks_from_2015_2024_history_df.csv || true; \
            git fetch origin main; \
            git reset --hard origin/main; \
            git clean -fd || true; \
            chmod +x scripts/deploy/deploy_docker_remote.sh scripts/deploy/setup_nginx_vhost.sh || true; \
            AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
            AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            AWS_REGION='$AWS_REGION' \
            S3_BUCKET='$S3_BUCKET' \
            CONTAINER_NAME='$CONTAINER_NAME' \
            HOST_PORT='$HOST_PORT' \
            DASH_PORT='$DASH_PORT' \
            DOMAIN_NAME='$DOMAIN_NAME' \
            OLD_DOMAIN_NAME='$OLD_DOMAIN_NAME' \
            CONFIGURE_NGINX='$CONFIGURE_NGINX' \
            PUBLIC_BASE_URL='https://$DOMAIN_NAME' \
            bash scripts/deploy/deploy_docker_remote.sh"

      - name: Check application logs
        if: always()
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'resulam-royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
        run: |
          set -euo pipefail
          echo "Checking container status and logs..."
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "\
            echo '=== Docker Container Status ==='; \
            docker ps -a | grep -F '$CONTAINER_NAME' || echo 'Container not found'; \
            echo ''; \
            echo '=== Last 30 lines of container log ==='; \
            docker logs '$CONTAINER_NAME' --tail 30 2>&1 || true; \
            echo ''; \
            echo '=== Container health status ==='; \
            docker inspect --format='{{.State.Health.Status}}' '$CONTAINER_NAME' 2>/dev/null || echo 'Health check not available'; \
            echo ''; \
            echo '=== Checking if port $HOST_PORT is listening ==='; \
            sudo netstat -tlnp | grep ':$HOST_PORT ' || echo 'Port $HOST_PORT not listening'"

      - name: Verify deployment
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'resulam-royalties.tchamna.com' }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
        run: |
          set -euo pipefail
          echo "Verifying application health..."
          max_attempts=12
          for i in $(seq 1 $max_attempts); do
            if curl -sf "https://$DOMAIN_NAME/" > /dev/null 2>&1; then
              echo "OK: https://$DOMAIN_NAME"
              exit 0
            fi
            if ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "curl -sf http://127.0.0.1:$HOST_PORT/ >/dev/null 2>&1 && curl -sf http://127.0.0.1:$HOST_PORT/authors/ >/dev/null 2>&1"; then
              echo "OK: container is responding on localhost:$HOST_PORT"
              exit 0
            fi
            echo "Attempt $i/$max_attempts: waiting..."
            sleep 5
          done
          echo "ERROR: Health check failed"
          exit 1

  rollback:
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    permissions:
      contents: read

    steps:
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rollback (docker)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME || 'resulam-royalties' }}
          HOST_PORT: ${{ secrets.HOST_PORT || '8050' }}
          DASH_PORT: ${{ secrets.DASH_PORT || '8050' }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'resulam-royalties.tchamna.com' }}
        run: |
          set -euo pipefail
          echo "Rollback: starting resulam-royalties:previous if available"
          ssh -i ~/.ssh/ec2-key.pem -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "set -euo pipefail; \
            if ! docker image inspect resulam-royalties:previous >/dev/null 2>&1; then \
              echo 'No previous image found; rollback skipped.'; \
              exit 0; \
            fi; \
            docker stop '$CONTAINER_NAME' 2>/dev/null || true; \
            docker rm '$CONTAINER_NAME' 2>/dev/null || true; \
            docker run -d \
              --name '$CONTAINER_NAME' \
              --restart unless-stopped \
              -p 127.0.0.1:$HOST_PORT:$DASH_PORT \
              -e PUBLIC_BASE_URL='https://$DOMAIN_NAME' \
              resulam-royalties:previous; \
            docker logs '$CONTAINER_NAME' --tail 50 || true"
